[workspace]
members = [".", "crates/vector_store", "crates/rag_pipeline", "crates/agent_orchestrator"]
resolver = "2"

[package]
name = "semantic-code-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "GPL-3.0-only"

[dependencies]
oxigraph = "0.5"
sparesults = "0.3"
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
toml = "0.8"
ignore = "0.4"
oxc_parser = "0.114"
oxc_ast = "0.114"
oxc_allocator = "0.114"
oxc_span = "0.114"
git2 = { version = "0.20", features = ["vendored-openssl"] }
time = { version = "0.3", features = ["formatting"] }
agent_orchestrator = { path = "crates/agent_orchestrator" }
rag_pipeline = { path = "crates/rag_pipeline" }
vector_store = { path = "crates/vector_store" }
rustpython-parser = { version = "0.4", features = ["all-nodes-with-ranges"] }

[dev-dependencies]
tempfile = "3"
git2 = { version = "0.20", features = ["vendored-openssl"] }
