[package]
name = "oxigraph-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
oxigraph = "0.5"
sparesults = "0.3"
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"
walkdir = "2"
