[package]
name = "rag_pipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "GPL-3.0-only"

[dependencies]
vector_store = { path = "../vector_store" }
async-trait = "0.1"
anyhow = "1"
oxigraph = "0.5"
sparesults = "0.3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
