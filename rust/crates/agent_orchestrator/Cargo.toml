[package]
name = "agent_orchestrator"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "GPL-3.0-only"

[dependencies]
rag_pipeline = { path = "../rag_pipeline" }
vector_store = { path = "../vector_store" }
oxigraph = "0.5"
sparesults = "0.3"
async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
